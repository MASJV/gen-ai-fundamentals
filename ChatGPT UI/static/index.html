<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Chatbot</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #343541;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */

        .header {
            height: 60px;
            background: #202123;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #444;
        }

        /* Messages */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
        }

        .message {
            display: flex;
            margin-bottom: 25px;
        }

        .user {
            justify-content: flex-end;
        }

        .bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 15px 18px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #19c37d;
            color: white;
        }

        .bot .bubble {
            background: #444654;
        }

        /* Input area */

        .input-area {
            padding: 15px;
            background: #202123;
            display: flex;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            background: #40414f;
            color: white;
        }

        #message::placeholder {
            color: #bbb;
        }

        button {
            padding: 0 22px;
            border: none;
            border-radius: 10px;
            background: #19c37d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #15a66a;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

    </style>

</head>


<body>

<div class="chat-container">

    <div class="header">
        🤖 My AI Assistant
    </div>


    <div id="messages" class="messages">

        <div class="message bot">
            <div class="bubble">
                Hello! 👋 How can I help you today?
            </div>
        </div>

    </div>


    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Message your AI..."
            onkeydown="handleKey(event)"
        >

        <button id="sendButton" onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

async function sendMessage() {

    const input = document.getElementById("message");
    const button = document.getElementById("sendButton");
    const messages = document.getElementById("messages");

    const message = input.value.trim();

    if (message === "") {
        return;
    }


    // Display user message

    messages.innerHTML += `
        <div class="message user">
            <div class="bubble">
                ${escapeHTML(message)}
            </div>
        </div>
    `;


    input.value = "";

    button.disabled = true;
    button.innerText = "Thinking...";


    // Temporary bot message

    const botMessage = document.createElement("div");

    botMessage.className = "message bot";

    botMessage.innerHTML = `
        <div class="bubble">
            Thinking...
        </div>
    `;

    messages.appendChild(botMessage);


    // Scroll down

    messages.scrollTop = messages.scrollHeight;


    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });


        const data = await response.json();


        botMessage.querySelector(".bubble").innerText =
            data.reply;


    } catch (error) {

        botMessage.querySelector(".bubble").innerText =
            "Sorry, something went wrong.";

        console.error(error);

    }


    button.disabled = false;
    button.innerText = "Send";

    input.focus();

    messages.scrollTop = messages.scrollHeight;
}


function handleKey(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>

</html>
